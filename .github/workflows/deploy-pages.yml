name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build Vite Frontend
        run: npx vite build --base=./
        env:
          VITE_API_URL: ${{ secrets.CLOUD_RUN_API_URL }}
          VITE_FIREBASE_PROJECT_ID: "user-authenticated-ai-app"
          VITE_FIREBASE_API_KEY: "AIzaSyAz3WEeCZvpWyRXvjleQ8yZ_mK8Co8zAt8"
          VITE_FIREBASE_AUTH_DOMAIN: "user-authenticated-ai-app.firebaseapp.com"
          VITE_FIREBASE_STORAGE_BUCKET: "user-authenticated-ai-app.firebasestorage.app"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "1011512658257"
          VITE_FIREBASE_APP_ID: "1:1011512658257:web:d20502c05ca7779e18eb70"
          VITE_FIREBASE_MEASUREMENT_ID: "G-3P5WGQHL1J"
          VITE_FIRESTORE_DATABASE_ID: "(default)"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
